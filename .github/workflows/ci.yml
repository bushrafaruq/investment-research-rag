name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt ruff
      - run: ruff check .
      - run: python -m pytest -q

  evaluate:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/download_filings.py
      - run: python -m rag.cli ingest data/filings data/injection_tests --out index/eval_chunks.jsonl
      - run: python eval/run_eval.py
      - uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval/results

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Build a small index for the container
        run: |
          mkdir -p smoke && printf 'ACME 2022 annual report.\n--- page ---\nNet revenue for 2022 was $5,200 million, up 12%% on 2021, driven by sensor sales.\n' > smoke/ACME_2022_10K.txt
          python -m rag.cli ingest smoke --out index/chunks.jsonl
      - name: Build image
        run: docker build -t rag-copilot .
      - name: Run container and call the API
        run: |
          docker run -d --name rag -p 8000:8000 -v "$PWD/index:/app/index:ro" -e RAG_ANSWERER=extractive rag-copilot
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 2; done
          curl -sf localhost:8000/documents
          curl -sf -X POST localhost:8000/ask -H 'content-type: application/json' \
            -d '{"question": "What was ACME net revenue in 2022?"}' | tee answer.json
          python -c "import json; a = json.load(open('answer.json')); assert a['citations'], a"
      - if: failure()
        run: docker logs rag
